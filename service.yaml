apiVersion: v1
kind: Service
metadata:
  name: django-service
spec:
  type: NodePort  # Use 'LoadBalancer' for cloud (e.g., AWS, GKE)
  selector:
    app: django
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080  # You can access it at http://<node-ip>:30080
